name: Linux Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libdbus-1-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libgl-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        # Pin a portable CPU baseline so the released binary runs on older CPUs.
        # Without this, the native target bakes in host-only instructions (e.g.
        # BMI2 `shlx`) that crash with SIGILL on CPUs lacking them.
        run: zig build -Doptimize=ReleaseFast -Dtarget=x86_64-linux-gnu -Dcpu=baseline

      - name: Package
        run: |
          mkdir package
          cp zig-out/bin/UsaProject package/
          zip -r UsaProject-linux.zip package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsaProject-linux
          path: UsaProject-linux.zip
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: UsaProject-linux.zip
