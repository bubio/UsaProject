name: Linux Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/macos.yml"
      - ".github/workflows/windows.yml"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/macos.yml"
      - ".github/workflows/windows.yml"
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libdbus-1-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libgl-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Resolve artifact version
        run: |
          VERSION="$(grep -m1 '\.version = "' build.zig.zon | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "ARTIFACT_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build
        # Pin the x86_64-v2 microarchitecture level (2009+ CPUs) so the released
        # binary stays portable. The native target would bake in host-only
        # instructions (e.g. BMI2 `shlx`, part of v3) that crash with SIGILL on
        # CPUs lacking them; v2 avoids BMI2 while still allowing SSE4.2 etc.
        # Set only -Dcpu (not -Dtarget): keeping the native OS/ABI lets Zig find the
        # system libraries (asound/GL/X11/etc). An explicit -Dtarget makes Zig treat
        # the build as cross-compilation and skip the native library search paths.
        run: zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v2

      - name: Package
        run: |
          mkdir package
          cp zig-out/bin/UsaProject package/
          # Ship the bundled font's OFL license (M PLUS 1p is embedded in the binary).
          cp assets/fonts/OFL.txt package/MPLUS1p-OFL.txt
          zip -r UsaProject-${ARTIFACT_VERSION}-linux-x86_64.zip package/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: UsaProject-${{ env.ARTIFACT_VERSION }}-linux-x86_64
          path: UsaProject-${{ env.ARTIFACT_VERSION }}-linux-x86_64.zip
          if-no-files-found: error

      - name: Install nfpm
        if: github.event_name == 'release'
        run: |
          NFPM_VERSION=2.46.3
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb

      - name: Build deb and rpm packages
        if: github.event_name == 'release'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Strip the leading "v" from the tag (e.g. v0.2.0 -> 0.2.0) for nfpm.
          export VERSION="${VERSION#v}"
          mkdir -p dist
          nfpm package -f packaging/nfpm.yaml -p deb -t "dist/UsaProject-${VERSION}-linux-x86_64.deb"
          nfpm package -f packaging/nfpm.yaml -p rpm -t "dist/UsaProject-${VERSION}-linux-x86_64.rpm"
          ls -la dist

      - name: Build AppImage
        if: github.event_name == 'release'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Strip the leading "v" from the tag (e.g. v0.2.0 -> 0.2.0).
          export VERSION="${VERSION#v}"
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          curl -fsSL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/pixmaps dist
          cp zig-out/bin/UsaProject AppDir/usr/bin/usaproject
          cp packaging/usaproject.desktop AppDir/usr/share/applications/usaproject.desktop
          cp assets/AppIcon.png AppDir/usr/share/pixmaps/usaproject.png
          cp assets/AppIcon.png AppDir/usaproject.png
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          SELF="$(readlink -f "$0")"
          HERE="${SELF%/*}"
          exec "$HERE/usr/bin/usaproject" "$@"
          EOF
          chmod +x AppDir/AppRun

          ARCH=x86_64 /tmp/appimagetool.AppImage AppDir "dist/UsaProject-${VERSION}-linux-x86_64.AppImage"
          ls -la dist

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            UsaProject-${{ env.ARTIFACT_VERSION }}-linux-x86_64.zip
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
