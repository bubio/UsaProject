name: Windows Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/linux.yml"
      - ".github/workflows/macos.yml"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/linux.yml"
      - ".github/workflows/macos.yml"
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        # Pin the x86_64-v3 microarchitecture level (2013+ CPUs: AVX2/BMI2/FMA) so
        # the released binary is portable across modern CPUs. v4 is intentionally
        # avoided: it requires AVX-512, which most consumer CPUs lack (Intel fused
        # it off on 12th-gen+ consumer parts; AMD only added it in Zen 4).
        run: zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v3

      - name: Package
        shell: pwsh
        run: |
          mkdir package
          copy zig-out\bin\UsaProject.exe package\
          # Ship the bundled font's OFL license (M PLUS 1p is embedded in the binary).
          copy assets\fonts\OFL.txt package\MPLUS1p-OFL.txt
          Compress-Archive -Path package\* -DestinationPath UsaProject-windows.zip

      - name: Upload artifact
        # Upload the raw package contents, NOT the .zip. upload-artifact always
        # zips whatever path it is given, so handing it a .zip yields a
        # zip-inside-a-zip on download. The pre-made zip is kept only for the
        # release asset below, where it is uploaded as-is.
        uses: actions/upload-artifact@v4
        with:
          name: UsaProject-windows
          path: package\*
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: UsaProject-windows.zip
