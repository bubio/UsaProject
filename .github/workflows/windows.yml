name: Windows Build

# Disabled: NP2kai compiler_base.h conflicts with Windows SDK headers,
# and Zig 0.16.0 std has a clock_gettime issue on Windows.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Package
        shell: pwsh
        run: |
          mkdir package
          copy zig-out\bin\UsaProject.exe package\
          Compress-Archive -Path package\* -DestinationPath UsaProject-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsaProject-windows
          path: UsaProject-windows.zip
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: UsaProject-windows.zip
