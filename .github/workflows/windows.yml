name: Windows Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  release:
    types:
      - published
  workflow_dispatch:

env:
  ZIG_VERSION: 0.16.0

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/$env:ZIG_VERSION/zig-windows-x86_64-$env:ZIG_VERSION.zip" -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath .
          echo "$PWD\zig-windows-x86_64-$env:ZIG_VERSION" | Out-File -Append $env:GITHUB_PATH

      - name: Build
        run: zig build -Doptimize=ReleaseFast

      - name: Package
        shell: pwsh
        run: |
          mkdir package
          copy zig-out\bin\UsaProject.exe package\
          Compress-Archive -Path package\* -DestinationPath UsaProject-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsaProject-windows
          path: UsaProject-windows.zip
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: UsaProject-windows.zip
