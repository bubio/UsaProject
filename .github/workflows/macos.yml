name: macOS Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/linux.yml"
      - ".github/workflows/windows.yml"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/workflows/linux.yml"
      - ".github/workflows/windows.yml"
  release:
    types:
      - published
  workflow_dispatch:
env:
  zig_version: 0.16.0

jobs:
  build-macos:
    name: macOS Build
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.zig_version }}

      - name: Resolve artifact version
        run: |
          VERSION="$(grep -m1 '\.version = "' build.zig.zon | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "ARTIFACT_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build universal binary
        # macos-latest runners are arm64. Build the .app natively (arm64), build an
        # x86_64 slice, then lipo them into one universal binary so the released app
        # runs on both Apple Silicon and Intel Macs.
        #
        # The x86_64 slice uses -Dtarget=x86_64-native (NOT x86_64-macos): keeping
        # the OS component "native" lets Zig auto-detect the macOS SDK and find the
        # system frameworks (AppKit/Metal/etc). An explicit -macos marks the OS as
        # non-native, skips SDK detection, and the framework link fails.
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          zig build bundle -Doptimize=ReleaseFast
          zig build -Doptimize=ReleaseFast -Dtarget=x86_64-native -p zig-out-x64
          lipo -create \
            zig-out/UsaProject.app/Contents/MacOS/UsaProject \
            zig-out-x64/bin/UsaProject \
            -output zig-out/UsaProject.app/Contents/MacOS/UsaProject
          lipo -info zig-out/UsaProject.app/Contents/MacOS/UsaProject

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            zig-out/UsaProject.app \
            zig-out/UsaProject-${ARTIFACT_VERSION}-macOS-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: UsaProject-${{ env.ARTIFACT_VERSION }}-macOS-universal
          path: zig-out/UsaProject-${{ env.ARTIFACT_VERSION }}-macOS-universal.zip
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: zig-out/UsaProject-${{ env.ARTIFACT_VERSION }}-macOS-universal.zip
