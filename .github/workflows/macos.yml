name: macOS Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  release:
    types:
      - published
  workflow_dispatch:

env:
  ZIG_VERSION: 0.16.0

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        run: |
          curl -L -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-macos-aarch64-${ZIG_VERSION}.tar.xz"
          tar xf zig.tar.xz
          echo "$PWD/zig-macos-aarch64-${ZIG_VERSION}" >> $GITHUB_PATH

      - name: Build
        run: zig build bundle -Doptimize=ReleaseFast

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            zig-out/UsaProject.app \
            zig-out/UsaProject-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsaProject-macos
          path: zig-out/UsaProject-macos.zip
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: zig-out/UsaProject-macos.zip
